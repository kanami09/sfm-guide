# Step 2 of the automatic PR review.
# Triggered when "PR Check" finishes. Runs with write access to PRs, so it must never
# execute code from the PR: it only checks out the default branch (trusted) and reads
# the artifact that "PR Check" produced.
name: PR Review

on:
  workflow_run:
    workflows: [PR Check]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      # Default branch only; the review script comes from trusted code, not from the PR.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # A missing artifact means the check job crashed; the script then reports every check as not run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-review
          path: pr-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@v7
        with:
          script: |
            const review = require('./.github/scripts/pr-review.js');
            await review({ github, context, core });
