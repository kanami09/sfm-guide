# Step 1 of the automatic PR review.
# Runs the PR's code with a read-only token and stores the results as an artifact.
# The verdict is posted by pr-review.yml, which never executes PR code.
name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MARKDOWNLINT_CLI2_VERSION: 0.23.3
  MDBOOK_VERSION: 0.5.4

jobs:
  check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run checks
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p pr-review
          echo "$PR_NUMBER" > pr-review/number
          echo "$PR_HEAD_SHA" > pr-review/sha

          # Each check records its exit code; a failing check does not stop the others.
          set +e

          npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" "**/*.md" "#book" "#node_modules" \
            > pr-review/markdownlint.txt 2>&1
          echo $? > pr-review/markdownlint.status

          bash tools/sfml-check/check.sh > pr-review/sfml.txt 2>&1
          echo $? > pr-review/sfml.status

          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mdbook" build > pr-review/mdbook.txt 2>&1
          echo $? > pr-review/mdbook.status

          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: pr-review
          path: pr-review/
          retention-days: 7

      - name: Fail if any check failed
        run: |
          failed=0
          for c in markdownlint sfml mdbook; do
            s=$(cat "pr-review/$c.status")
            echo "$c: exit $s"
            [ "$s" = "0" ] || failed=1
          done
          exit "$failed"
