[book]
title = "SFML 编程指南"
description = "Super Factory Manager（超级工厂管理器）模组的 SFML 语言教程书：语法结构、关键字与实例。"
authors = ["kanami"]
language = "zh-CN"
src = "src"

[output.html]
site-url = "/sfm-guide/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/sfml.css"]
additional-js = ["theme/sfml-highlight.js"]
no-section-label = false
git-repository-url = "https://github.com/kanami09/sfm-guide"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
